name: memcached_tls
description: 'Behavior test for Memcached with TLS'

runs:
  using: "composite"
  steps:
    - name: Setup Memcached TLS server
      shell: bash
      run: |
        memcached_tls_dir="$(mktemp -d "$RUNNER_TEMP/opendal-memcached-tls.XXXXXX")"
        bash fixtures/memcached/setup-tls.sh "$memcached_tls_dir"
        cat << EOF >> "$GITHUB_ENV"
        OPENDAL_MEMCACHED_ENDPOINT=tcp://127.0.0.1:11212
        OPENDAL_MEMCACHED_ENABLE_TLS=true
        OPENDAL_MEMCACHED_ROOT=/
        SSL_CERT_FILE=$memcached_tls_dir/roots.pem
        EOF
