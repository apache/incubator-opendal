name: Bindings C CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
    paths: &paths
      - "bindings/c/**"
      - "core/**"
      - ".github/actions/setup/**"
      - ".github/workflows/ci_bindings_c.yml"
  pull_request:
    branches:
      - main
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup

      - name: Install C build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config uuid-dev libcurl4-gnutls-dev

      # Useful for debugging
      - name: Print Clippy version
        working-directory: "bindings/c"
        run: cargo clippy --version

      - name: Clippy Check
        working-directory: "bindings/c"

        run: |
          cargo clippy -- -D warnings

      - name: Build C binding
        working-directory: "bindings/c"
        run: |
          mkdir build && cd build
          cmake .. -DTEST_ENABLE_ASAN=ON -DFEATURES=opendal/services-memory
          make -j$(nproc)

      - name: Check diff
        run: git diff --exit-code

      - name: Run getting-started example
        working-directory: "bindings/c"
        run: ./build/getting_started

      - name: Build and Run tests
        working-directory: "bindings/c"
        run: ./build/tests

      - name: Build OpenDAL C library for test framework
        working-directory: "bindings/c"
        run: cargo build --features="opendal/services-memory"

      - name: Build test framework
        working-directory: "bindings/c/tests"
        run: make clean && make

      - name: Run test framework verification
        working-directory: "bindings/c/tests"
        run: ./verify_framework.sh

      - name: Run test framework with memory service
        working-directory: "bindings/c/tests"
        run: OPENDAL_TEST=memory make behavior_test

      - name: List available test suites
        working-directory: "bindings/c/tests"
        run: make list-suites

      - name: Run CI integration test
        working-directory: "bindings/c/tests"
        run: ./test_ci_integration.sh
