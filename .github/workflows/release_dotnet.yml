name: Release Dotnet Binding

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/release_dotnet.yml"
      - "bindings/dotnet/build.py"
      - "bindings/dotnet/OpenDAL/OpenDAL.csproj"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-native:
    name: Build Native - ${{ matrix.classifier }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: "bindings/dotnet"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            classifier: linux-x86_64
            artifact: libopendal_dotnet.so
          - os: ubuntu-24.04-arm
            classifier: linux-aarch_64
            artifact: libopendal_dotnet.so
          - os: windows-latest
            classifier: windows-x86_64
            artifact: opendal_dotnet.dll
          - os: macos-latest
            classifier: osx-aarch_64
            artifact: libopendal_dotnet.dylib

    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup
        with:
          need-protoc: true
          need-rocksdb: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native library
        run: python build.py --classifier ${{ matrix.classifier }}

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.classifier }}
          path: bindings/dotnet/target/native/${{ matrix.classifier }}/${{ matrix.artifact }}
          if-no-files-found: error

  package:
    name: Pack NuGet package
    runs-on: ubuntu-latest
    needs:
      - build-native
    defaults:
      run:
        working-directory: "bindings/dotnet"

    steps:
      - uses: actions/checkout@v7
      - name: Setup dotnet toolchain
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # Keep one directory per artifact: the Linux x64 and Linux arm64 builds
      # share the libopendal_dotnet.so file name, so merging them into a single
      # directory would drop one of the two libraries.
      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: bindings/dotnet/target/release-assets

      - name: Prepare runtime assets
        shell: bash
        run: |
          mkdir -p OpenDAL/runtimes/win-x64/native
          mkdir -p OpenDAL/runtimes/linux-x64/native
          mkdir -p OpenDAL/runtimes/linux-arm64/native
          mkdir -p OpenDAL/runtimes/osx-arm64/native

          cp target/release-assets/native-windows-x86_64/opendal_dotnet.dll OpenDAL/runtimes/win-x64/native/
          cp target/release-assets/native-linux-x86_64/libopendal_dotnet.so OpenDAL/runtimes/linux-x64/native/
          cp target/release-assets/native-linux-aarch_64/libopendal_dotnet.so OpenDAL/runtimes/linux-arm64/native/
          cp target/release-assets/native-osx-aarch_64/libopendal_dotnet.dylib OpenDAL/runtimes/osx-arm64/native/

      - name: Determine version suffix
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # Release tags decide the suffix regardless of how the run was
          # started: the release automation pushes final tags with
          # GITHUB_TOKEN and then dispatches this workflow on the tag, so a
          # final release can arrive as a workflow_dispatch event. Any other
          # ref packs a preview build that is only kept as an artifact.
          suffix=""
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.([0-9]+)$ ]]; then
            suffix="rc.${BASH_REMATCH[1]}"
          elif [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            suffix=""
          else
            suffix="preview.${GITHUB_RUN_NUMBER}"
          fi

          echo "version_suffix=${suffix}" >> "$GITHUB_OUTPUT"

      - name: Pack OpenDAL
        shell: bash
        run: |
          set -euo pipefail

          pack_args=(
            OpenDAL/OpenDAL.csproj
            -c Release
            -o artifacts/package
          )
          if [[ -n "${{ steps.version.outputs.version_suffix }}" ]]; then
            pack_args+=(--version-suffix "${{ steps.version.outputs.version_suffix }}")
          fi

          dotnet pack "${pack_args[@]}"

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-package
          path: bindings/dotnet/artifacts/package/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
    runs-on: ubuntu-latest
    needs:
      - package
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup dotnet toolchain
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Download NuGet package
        uses: actions/download-artifact@v8
        with:
          name: dotnet-package
          path: bindings/dotnet/artifacts/package

      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          # The nuget.org account that created the trusted publishing policy,
          # not the package owner (Apache.OpenDAL organization).
          user: Fatorin

      - name: Publish package
        run: dotnet nuget push bindings/dotnet/artifacts/package/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
