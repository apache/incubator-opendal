name: Bindings Dart CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
    paths: &paths
      - "core/**"
      - "bindings/dart/**"
      - ".github/actions/setup/**"
      - ".github/workflows/ci_bindings_dart.yml"
  pull_request:
    branches:
      - main
    paths: *paths
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.35.7"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            bindings/dart/rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Check generated bridge code is sync
        working-directory: bindings/dart
        run: |
          set -eux -o pipefail
          git diff

      - name: Flutter pub get
        working-directory: bindings/dart
        run: flutter pub get

      # Useful for debugging
      - name: Print Clippy version
        working-directory: bindings/dart/rust
        run: cargo clippy --version

      - name: Check Clippy
        working-directory: bindings/dart/rust
        run: cargo clippy -- -D warnings

      - name: build lib
        working-directory: bindings/dart/rust
        run: |
          set -eux -o pipefail
          cargo build -r
          cargo build -r --target x86_64-unknown-linux-gnu
          ls -R .

      - name: test
        working-directory: bindings/dart
        run: |
          dart run tests/opendal_test.dart
          dart run examples/basic.dart
          dart run examples/getting_started.dart
