name: Core CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "core/**"
      - ".github/workflows/ci_core.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check_docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup
        with:
          need-rocksdb: true
          need-protoc: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout java env
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Cargo doc
        working-directory: core
        env:
          RUSTDOCFLAGS: >-
            -D rustdoc::broken_intra_doc_links
            -D rustdoc::invalid_rust_codeblocks
            -D rustdoc::bare_urls
        run: |
          cargo doc --workspace --lib --no-deps --all-features
          cargo doc --package opendal-service-opfs --lib --no-deps --all-features \
            --target wasm32-unknown-unknown

  check_clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup
        with:
          need-rocksdb: true
          need-protoc: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout java env
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      # Useful for debugging
      - name: Print Clippy version
        working-directory: core
        run: cargo clippy --version

      - name: Cargo clippy
        working-directory: core
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  check_msrv:
    runs-on: ubuntu-latest
    env:
      # OpenDAL's MSRV is 1.91.
      OPENDAL_MSRV: "1.91"
    steps:
      - uses: actions/checkout@v7
      - name: Setup msrv of rust
        run: |
          rustup toolchain install ${OPENDAL_MSRV}
          rustup component add clippy --toolchain ${OPENDAL_MSRV}

      # Useful for debugging
      - name: Print Clippy version
        working-directory: core
        run: cargo +${OPENDAL_MSRV} clippy --version

      - name: Check
        working-directory: core
        run: cargo +${OPENDAL_MSRV} clippy -- -D warnings

  build_default_features:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        working-directory: core
        run: cargo build --locked

  run_examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Examples back the snippets shown in the website guide. Running them keeps
      # the docs honest: a broken example fails CI instead of shipping bad docs.
      - name: Run guide examples
        working-directory: core
        run: cargo run -p opendal-examples-getting-started

  build_all_features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout python env
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Checkout java env
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup
        with:
          need-rocksdb: true
          need-protoc: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        working-directory: core
        run: cargo build --all-features --locked

  build_all_platforms:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Checkout python env
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Checkout java env
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup
        with:
          need-rocksdb: true
          need-protoc: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        shell: bash
        working-directory: core
        run: |
          FEATURES=(
            services-alluxio
            services-azblob
            services-azdls
            services-cacache
            services-cos
            services-dashmap
            services-dropbox
            services-etcd
            # FIXME this requires a preinstalled fdb library
            # services-foundationdb
            services-fs
            services-ftp
            services-gcs
            services-gdrive
            services-ghac
            # FIXME how to support HDFS services in other platforms?
            # services-hdfs
            services-http
            services-hf
            services-ipfs
            services-ipmfs
            services-memcached
            services-memory
            services-mini-moka
            services-moka
            services-obs
            services-onedrive
            services-oss
            services-persy
            services-postgresql
            services-redb
            services-redis
            # TODO: we need to find ways to using pre-install rocksdb library
            # services-rocksdb
            services-s3
            services-seafile
            # TODO: sftp is known to not work on windows, waiting for https://github.com/apache/opendal/issues/2963
            # services-sftp
            services-sled
            services-swift
            services-tikv
            services-vercel-artifacts
            services-webdav
            services-webhdfs
          )
          cargo build --features "${FEATURES[*]}" --locked

  # We only support some services(see `available_services` below) for now.
  build_under_wasm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        working-directory: core
        run: |
          FEATURES=(
            services-azblob
            services-gdrive
            services-opfs
            services-s3
            layers-metrics
          )
          rustup target add wasm32-unknown-unknown
          cargo build --target wasm32-unknown-unknown --no-default-features --features="${FEATURES[*]}" --locked

  unit:
    runs-on: ubuntu-latest

    steps:
      - name: cleanup
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/chromium \
            /opt/microsoft \
            /opt/google \
            /usr/lib/firefox

          sudo docker image prune --all --force
          sudo docker builder prune -a

      - uses: actions/checkout@v7

      - name: Checkout python env
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Checkout java env
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup
        with:
          need-protoc: true
          need-rocksdb: true
          need-foundationdb: true
          need-nextest: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        working-directory: core
        run: |
          cargo nextest run --workspace --no-fail-fast --all-features
        env:
          # Add rocksdb and java lib path to LD_LIBRARY_PATH
          LD_LIBRARY_PATH: /tmp/rocksdb/lib:${{ env.JAVA_HOME }}/lib/server:${{ env.LD_LIBRARY_PATH }}

  doc-test:
    runs-on: ubuntu-latest

    steps:
      - name: cleanup
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/chromium \
            /opt/microsoft \
            /opt/google \
            /usr/lib/firefox

          sudo docker image prune --all --force
          sudo docker builder prune -a

      - uses: actions/checkout@v7

      - name: Checkout python env
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Checkout java env
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup
        with:
          need-protoc: true
          need-rocksdb: true
          need-foundationdb: true
          need-nextest: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        working-directory: core
        run: |
          cargo test --workspace --doc --all-features
        env:
          # Add rocksdb and java lib path to LD_LIBRARY_PATH
          LD_LIBRARY_PATH: /tmp/rocksdb/lib:${{ env.JAVA_HOME }}/lib/server:${{ env.LD_LIBRARY_PATH }}
