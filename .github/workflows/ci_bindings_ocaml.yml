name: Bindings OCaml CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
    paths: &paths
      - "bindings/ocaml/**"
      - "core/**"
      - ".github/actions/setup-ocaml/**"
      - ".github/workflows/ci_bindings_ocaml.yml"
  pull_request:
    branches:
      - main
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7

      - name: Setup OCaml toolchain
        uses: ./.github/actions/setup-ocaml
        with:
          need-depext: true
          need-pin: true

      # Useful for debugging
      - name: Print Clippy version
        working-directory: "bindings/ocaml"
        run: cargo clippy --version

      - name: Clippy Check
        working-directory: "bindings/ocaml"
        run: cargo clippy -- -D warnings

  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout PR
        uses: actions/checkout@v7

      - name: Setup OCaml toolchain
        uses: ./.github/actions/setup-ocaml
        with:
          need-depext: true
          need-pin: true

      - name: Checks
        run: |
          # make sure tests pass
          opam install -y dune ounit2 ocamlformat
          eval $(opam env)
          cd bindings/ocaml
          dune build @fmt
          dune runtest

      - name: Run getting-started example
        run: |
          eval $(opam env)
          cd bindings/ocaml
          dune build examples/getting_started.exe
          dune build @run_examples
