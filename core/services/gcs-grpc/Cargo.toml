[package]
description = "Apache OpenDAL Google Cloud Storage gRPC service implementation"
name = "opendal-service-gcs-grpc"
readme = "README.md"

authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[dependencies]
bytes = { workspace = true }
futures = { workspace = true, features = ["async-await", "std"] }
http = { workspace = true }
log = { workspace = true }
opendal-core = { path = "../../core", version = "0.59.5", default-features = false, features = [
  "reqsign",
] }
percent-encoding = "2"
prost = { version = "0.14.3", default-features = false }
prost-types = { version = "0.14.3", default-features = false }
reqsign-core = { version = "3.2.0", default-features = false }
reqsign-file-read-tokio = { version = "3.0.0", default-features = false }
reqsign-google = { version = "3.0.3", default-features = false }
serde = { workspace = true, features = ["derive"] }
tonic = { version = "0.14.5", default-features = false, features = [
  "channel",
  "codegen",
  "tls-aws-lc",
  "tls-webpki-roots",
] }
tonic-prost = { version = "0.14.5", default-features = false }

[dev-dependencies]
serde_json = { workspace = true }
