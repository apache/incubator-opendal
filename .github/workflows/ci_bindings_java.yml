# Task-only paired JDK 8 validation; excluded from the repair PR.
name: Bindings Java CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader-reset-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup
        with:
          need-protoc: true
          need-rocksdb: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 8
          cache: maven
          cache-dependency-path: bindings/java/pom.xml
      - name: Original conditional-response fixture
        continue-on-error: true
        shell: bash
        run: |
          git fetch --depth=1 origin a784be71d7eeab2587794512e1c8598ad8e72e99
          git checkout --detach a784be71d7eeab2587794512e1c8598ad8e72e99
          bash dev/task_java_reader_reset_probe.sh "$RUNNER_TEMP/java-reader-reset-baseline"
      - name: Completed-request fixture
        shell: bash
        run: |
          git checkout --detach "$GITHUB_SHA"
          bash dev/task_java_reader_reset_probe.sh "$RUNNER_TEMP/java-reader-reset-fixed"
      - name: Preserve paired test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-reader-reset-jdk8
          path: |
            ${{ runner.temp }}/java-reader-reset-baseline
            ${{ runner.temp }}/java-reader-reset-fixed
