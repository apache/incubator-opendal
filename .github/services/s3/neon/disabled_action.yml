name: neon
description: "Behavior test for Neon Object Storage."

runs:
  using: "composite"
  steps:
    - name: Setup
      uses: 1Password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
      with:
        export-env: true
      env:
        OPENDAL_S3_BUCKET: op://services/neon/bucket
        OPENDAL_S3_ENDPOINT: op://services/neon/endpoint
        OPENDAL_S3_ACCESS_KEY_ID: op://services/neon/access_key_id
        OPENDAL_S3_SECRET_ACCESS_KEY: op://services/neon/secret_access_key

    # Neon doesn't support versioning or append, and ignores conditional headers on copy, delete and multipart writes.
    # Refer to https://opendal.apache.org/docs/services/s3#compatible-services for more information
    - name: Add extra settings
      shell: bash
      run: |
        cat << EOF >> $GITHUB_ENV
        OPENDAL_S3_REGION=us-east-2
        OPENDAL_TEST_CAPABILITY_OVERRIDES=stat_with_version=false,read_with_version=false,delete_with_version=false,list_with_versions=false,list_with_deleted=false,copy_with_source_version=false,restore=false,restore_with_version=false,restore_with_if_not_exists=false,write_can_append=false,write_with_if_match=false,write_with_if_not_exists=false,delete_with_if_match=false,copy_with_if_not_exists=false,copy_with_if_match=false
        EOF
