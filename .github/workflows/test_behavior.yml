# Task-only real-provider probe; no production or author-branch change.
name: Behavior Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dropbox-list-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup
        with:
          need-protoc: true
          need-rocksdb: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup existing 1Password Connect access
        shell: bash
        env:
          OP_CONNECT_HOST: ${{ secrets.OP_CONNECT_HOST }}
          OP_CONNECT_TOKEN: ${{ secrets.OP_CONNECT_TOKEN }}
        run: |
          printf '::add-mask::%s\n' "$OP_CONNECT_HOST"
          printf '::add-mask::%s\n' "$OP_CONNECT_TOKEN"
          printf 'OP_CONNECT_HOST=%s\n' "$OP_CONNECT_HOST" >> "$GITHUB_ENV"
          printf 'OP_CONNECT_TOKEN=%s\n' "$OP_CONNECT_TOKEN" >> "$GITHUB_ENV"
      - name: Load existing Dropbox test credentials
        uses: ./.github/services/dropbox/dropbox
      - name: Run one native Dropbox contract probe
        shell: bash
        env:
          OPENDAL_TEST: dropbox
          OPENDAL_DISABLE_RANDOM_ROOT: 'true'
          CARGO_BUILD_JOBS: 4
          CARGO_TERM_COLOR: never
          RUST_LOG: 'off'
        run: |
          mkdir "$RUNNER_TEMP/dropbox-list-evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/dropbox-list-evidence/source.head-tree"
          set +e
          cargo test --manifest-path core/Cargo.toml --locked --test task_dropbox_list_contract --features tests,services-dropbox -- --nocapture --test-threads=1 > "$RUNNER_TEMP/dropbox-list-evidence/native.log" 2>&1
          task_probe_exit=$?
          printf '%s\n' "$task_probe_exit" > "$RUNNER_TEMP/dropbox-list-evidence/native.exit"
          cat "$RUNNER_TEMP/dropbox-list-evidence/native.log"
          exit "$task_probe_exit"
      - name: Preserve sanitized evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dropbox-list-evidence
          path: ${{ runner.temp }}/dropbox-list-evidence
