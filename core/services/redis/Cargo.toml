[package]
description = "Apache OpenDAL Redis service implementation"
name = "opendal-service-redis"
readme = "README.md"

authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[features]
default = ["rustls"]
native-tls = ["redis/tokio-native-tls-comp"]
rustls = ["redis/tokio-rustls-comp"]

[dependencies]
asyncband = { workspace = true, features = ["pool"] }
bytes = { workspace = true }
http = { workspace = true }
opendal-core = { path = "../../core", version = "0.59.5", default-features = false }
redis = { version = "1.2", features = [
  "cluster-async",
  "tokio-comp",
  "connection-manager",
] }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
