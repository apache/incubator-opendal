services:
  samba:
    image: ghcr.io/servercontainers/samba@sha256:ac7c406702a3bf4137fcd04ce031d87adbda1b819f698fe89a89b5ee46618dfb
    ports:
      - "127.0.0.1:1445:445"
    environment:
      ACCOUNT_opendal: opendal
      SAMBA_VOLUME_CONFIG_data: "[data]; path=/shares/data; read only=no; valid users=opendal; force user=root"
    volumes:
      - samba-data:/shares/data
    healthcheck:
      test: ["CMD", "smbclient", "//localhost/data", "-U", "opendal%opendal", "-c", "ls"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  samba-data:
