# Task-only proof of the public S3 container credential provider API.
name: Behavior Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s3-container-provider-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup
        with:
          need-protoc: true
          need-rocksdb: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup existing 1Password Connect access
        shell: bash
        env:
          OP_CONNECT_HOST: ${{ secrets.OP_CONNECT_HOST }}
          OP_CONNECT_TOKEN: ${{ secrets.OP_CONNECT_TOKEN }}
        run: |
          printf '::add-mask::%s\n' "$OP_CONNECT_HOST"
          printf '::add-mask::%s\n' "$OP_CONNECT_TOKEN"
          printf 'OP_CONNECT_HOST=%s\n' "$OP_CONNECT_HOST" >> "$GITHUB_ENV"
          printf 'OP_CONNECT_TOKEN=%s\n' "$OP_CONNECT_TOKEN" >> "$GITHUB_ENV"

      - name: Load existing AWS S3 fixture
        uses: ./.github/services/s3/aws_s3

      - name: Run one native S3 container provider proof
        shell: bash
        env:
          CARGO_BUILD_JOBS: 4
          CARGO_TERM_COLOR: never
          RUST_LOG: 'off'
          OPENDAL_TASK_EVIDENCE_DIR: ${{ runner.temp }}/opendal-s3-container-provider-evidence
        run: python3 dev/task_s3_container_provider.py

      - name: Preserve sanitized evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: s3-container-provider-proof
          path: ${{ runner.temp }}/opendal-s3-container-provider-evidence
          if-no-files-found: warn
