name: hdfs_default_on_silo_s3
description: 'Behavior test for hdfs default on Silo S3'

runs:
  using: "composite"
  steps:
    - name: Setup Silo Server
      shell: bash
      working-directory: fixtures/s3
      run: docker compose --file docker-compose-silo.yml up --quiet-pull --detach --wait

    - name: Setup test bucket
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: "minioadmin"
        AWS_SECRET_ACCESS_KEY: "minioadmin"
        AWS_EC2_METADATA_DISABLED: "true"
      run: aws --endpoint-url http://127.0.0.1:9000/ s3 mb s3://test

    - name: Setup hadoop
      uses: ./.github/actions/setup-hadoop
      with:
        connector-aws: true

    - name: Setup Hadoop AWS S3 connector env
      shell: bash
      run: |
        mkdir -p /tmp/hdfs

        pushd ${HADOOP_HOME}
        ./bin/hadoop credential create fs.s3a.access.key -value minioadmin -provider localjceks://file/tmp/hdfs/s3.jceks
        ./bin/hadoop credential create fs.s3a.secret.key -value minioadmin -provider localjceks://file/tmp/hdfs/s3.jceks
        popd

        cp ${{ github.workspace }}/fixtures/hdfs/silo-s3-core-site.xml ${HADOOP_HOME}/etc/hadoop/core-site.xml

        cat << EOF >> $GITHUB_ENV
        OPENDAL_HDFS_NAME_NODE=s3a://test
        OPENDAL_TEST_CAPABILITY_OVERRIDES=write_can_append=false
        EOF
