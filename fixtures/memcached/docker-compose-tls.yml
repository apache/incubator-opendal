services:
  memcached_tls:
    image: docker.io/library/memcached@sha256:462fa779babc9b64a235a69dd843cb79fb3591f229ee1f3ff6cb2ca058d8a759
    command: ["memcached", "-Z", "-I", "16777216", "-o", "ssl_chain_cert=/certs/server.pem,ssl_key=/certs/server.key,ssl_verify_mode=0"]
    ports:
      - "127.0.0.1:11212:11211"
    volumes:
      - "${MEMCACHED_TLS_CERT_DIR:?}:/certs:ro"
