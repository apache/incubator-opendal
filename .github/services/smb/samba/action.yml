name: samba
description: "Behavior tests against a Samba SMB server"

runs:
  using: "composite"
  steps:
    - name: Start Samba
      shell: bash
      run: docker compose -f fixtures/smb/docker-compose.yml up -d --wait
    - name: Configure SMB
      shell: bash
      run: |
        cat << EOF >> "$GITHUB_ENV"
        OPENDAL_SMB_ENDPOINT=127.0.0.1:1445
        OPENDAL_SMB_SHARE=data
        OPENDAL_SMB_ROOT=/opendal/
        OPENDAL_SMB_USER=opendal
        OPENDAL_SMB_PASSWORD=opendal
        EOF
    - name: Test SMB lifecycle and pagination
      shell: bash
      working-directory: core
      run: cargo test -p opendal-service-smb --test samba --locked -- --ignored
