[package]
description = "Apache OpenDAL FTP service implementation"
name = "opendal-service-ftp"
readme = "README.md"

authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[dependencies]
asyncband = { workspace = true, features = ["pool"] }
bytes = { workspace = true }
http = { workspace = true }
log = { workspace = true }
opendal-core = { path = "../../core", version = "0.59.5", default-features = false }
rustls-native-certs = "0.8"
serde = { workspace = true, features = ["derive"] }
suppaftp = { version = "10.0.2", default-features = false, features = [
  "tokio-rustls-ring",
] }
tokio = { workspace = true, features = ["io-util", "macros", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
